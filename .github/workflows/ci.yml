name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (Maven test, Boot 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/stroke-server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: medai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: medai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ci-test-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      AI_API_SHARED_JWT_SECRET: ci-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  model:
    name: Model (pytest, offline suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.lock
      - run: pip install uv && uv pip install --system -r requirements.lock
      # 离线测试全集: 不依赖 DashScope 密钥/外网与 PDF 语料
      # (test_rag / test_analyze_* / test_api_client 等需要密钥与在线服务, 仅在本地回归)
      - run: |
          python -m pytest tests/test_tools.py tests/test_collection_routing.py \
            tests/test_evidence_router.py tests/test_decision_planner.py \
            tests/test_medical_reranker.py tests/test_tool_use_integration.py \
            tests/test_evaluation_benchmark.py tests/test_structured_outputs.py \
            tests/test_hitl_checkpointer.py tests/test_model_router.py \
            tests/test_model_info.py tests/test_new_architecture.py \
            tests/test_health_endpoint.py tests/test_evaluation_gate.py \
            tests/test_security.py -q
      # 阶段6 评测闭环: RAGAS 基线快照硬门禁(检索指标不降级)
      - run: python -m app.evaluation.gate --ragas evaluation/ragas_snapshot.json
      # 阶段6 评测闭环: 离线安全/引用规则评测门禁(冻结预测回归金丝雀)
      - run: |
          python -m app.evaluation.benchmark \
            --cases evaluation/offline_cases.jsonl \
            --predictions evaluation/offline_predictions.jsonl \
            --output /tmp/offline_report.json \
            --gate --min-coverage 1.0 --min-pass-rate 0.8
