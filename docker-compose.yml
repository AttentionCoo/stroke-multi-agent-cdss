services:
  mysql:
    image: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}/mysql:8.4
    container_name: stroke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stroke-local-only}
      MYSQL_DATABASE: medai
    ports:
      - "3307:3306"   # 宿主机 3307 → 容器 3306(避免与本机 MySQL 冲突)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/stroke-server/sql/medai_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}/redis:7-alpine
    container_name: stroke-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-stroke-local-only}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stroke-local-only}
    ports:
      - "6379:6379"
    volumes:
      # 持久化: 容器重建后登录会话/限流/SSE 缓存不丢失
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: stroke-multi-agent-backend:${APP_IMAGE_TAG:-local}
    build:
      context: ./backend/stroke-server
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}
    container_name: stroke-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: medai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stroke-local-only}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: medai
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stroke-local-only}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stroke-local-only}
      AI_API_URL: http://model:8000
      AI_API_SHARED_JWT_SECRET: ${AI_API_SHARED_JWT_SECRET:-dev-local-secret-change-me-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CLINICAL_ZONE: ${CLINICAL_ZONE:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/monitor/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  model:
    image: stroke-multi-agent-model:${APP_IMAGE_TAG:-local}
    build:
      context: ./model
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: stroke-model
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      SECRET_KEY: ${AI_API_SHARED_JWT_SECRET:-dev-local-secret-change-me-at-least-32-characters}
      # 首次冷启动会为全部指南分块做 embedding; 关闭 QA 衍生可大幅缩短启动时间
      # (开启后首次启动需数百次 LLM 调用, 建议本地离线时段执行)
      ENABLE_QA_GENERATION: ${ENABLE_QA_GENERATION:-false}
      # 阶段3: LangGraph 检查点持久化(Sqlite, 支撑 HITL 人工复核挂起/续跑)
      CHECKPOINTER_PATH: /app/data/checkpoints.sqlite
      HITL_MAX_REJECTS: ${HITL_MAX_REJECTS:-2}
      # 阶段4: 多模型解耦 - 按角色覆盖型号(默认 qwen-plus/qwen-plus/qwen-turbo/qwen-plus)
      MODEL_MAIN: ${MODEL_MAIN:-}
      MODEL_FAST: ${MODEL_FAST:-}
      MODEL_TURBO: ${MODEL_TURBO:-}
      MODEL_CONSENSUS: ${MODEL_CONSENSUS:-}
      # 阶段7: 安全合规 - 并发闸与 CORS(默认关闭)
      MODEL_MAX_CONCURRENT_PER_USER: ${MODEL_MAX_CONCURRENT_PER_USER:-2}
      MODEL_MAX_CONCURRENT_GLOBAL: ${MODEL_MAX_CONCURRENT_GLOBAL:-8}
      MODEL_CORS_ORIGINS: ${MODEL_CORS_ORIGINS:-}
    volumes:
      - model-data:/app/data
      - model-cache:/app/model_cache
      - model-chroma:/app/chroma_db_unified
      - ./model/.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 900s

  frontend:
    image: stroke-multi-agent-frontend:${APP_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}
    container_name: stroke-frontend
    restart: unless-stopped
    ports:
      - "8088:80"   # 宿主机 8088 → 容器 80(80 端口被 Docker wslrelay 残留占用)
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  model-data:
  model-cache:
  model-chroma:
