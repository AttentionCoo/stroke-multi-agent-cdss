services:
  mysql:
    image: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}/mysql:8.0
    container_name: stroke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stroke-local-only}
      MYSQL_DATABASE: medai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/stroke-server/sql/medai_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}/redis:7-alpine
    container_name: stroke-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-stroke-local-only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stroke-local-only}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/stroke-server
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}
    container_name: stroke-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: medai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stroke-local-only}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-stroke-local-only}
      AI_API_URL: http://model:8000
      AI_API_SHARED_JWT_SECRET: ${AI_API_SHARED_JWT_SECRET:-dev-local-secret-change-me-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CLINICAL_ZONE: ${CLINICAL_ZONE:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      model:
        condition: service_started

  model:
    build:
      context: ./model
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: stroke-model
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      SECRET_KEY: ${AI_API_SHARED_JWT_SECRET:-dev-local-secret-change-me-at-least-32-characters}
    volumes:
      - model-data:/app/data
      - model-cache:/app/model_cache
      - model-chroma:/app/chroma_db_unified
      - ./model/.env:/app/.env:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${DOCKER_BASE_IMAGE_REGISTRY:-public.ecr.aws/docker/library}
    container_name: stroke-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  model-data:
  model-cache:
  model-chroma:
